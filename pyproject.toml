[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["mlex_dlsia"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.isort]
profile = "black"

[project]
name = "mlex_dlsia"
version = "0.2.0"
description = "DLSIA models for segmentation in MLExchange"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11, <=3.12"

dependencies = [
  "numpy==1.26.4",
  "qlty==0.2.0",
  "dvclive==3.44.0",
  "dlsia==0.3.4",
  "pydantic>=2.8",
  "tiled[client]==0.2.0",
  "mlflow==2.22.0",
  "torch==2.2.2"
]

[project.optional-dependencies]
dev = [
    "black==24.2.0",
    "flake8==7.0.0",
    "isort==5.13.2",
    "pre-commit==3.6.2",
    "tiled[all]==0.2.0",
    "pytest==8.1.1",
    "pytest-asyncio",
    "fastapi==0.121.3"
]
